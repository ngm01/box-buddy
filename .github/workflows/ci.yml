# Lint and build the web app on every pull request and on pushes to the
# long-lived branches. Deploys are separate: Amplify builds dev.boxbuddy.io
# from the dev branch (see amplify.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Same Node major as amplify.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # No .env.local here: the bundle only needs the Supabase/API values at
      # runtime, so the build itself succeeds without them.
      - run: npx quasar build
