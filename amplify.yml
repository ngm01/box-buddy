version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Quasar/Vite have compatibility issues on newer Node; pin LTS.
        - nvm install 20 && nvm use 20
        - npm ci
        # Quasar only injects env vars from .env files on disk, not from the
        # shell, so write Amplify's environment variables to .env.local.
        # All values here are publishable (they ship in the client bundle).
        # Never add the Supabase service role key or any Stripe secret.
        - printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > .env.local
        - printf 'SUPABASE_KEY=%s\n' "$SUPABASE_KEY" >> .env.local
        - printf 'API_BASE=%s\n' "$API_BASE" >> .env.local
        - printf 'WEB_BASE_URL=%s\n' "$WEB_BASE_URL" >> .env.local
    build:
      commands:
        - npx quasar build
  artifacts:
    baseDirectory: dist/spa
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
